name: Build and release add-in

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build Docker artifact and create release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export release artifact
        run: docker buildx build --progress=plain --output type=local,dest=artifacts .

      - name: Publish commit release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.0.${{ github.run_number }}
        run: |
          set -euo pipefail
          commit_subject="$(git show -s --format=%s "$GITHUB_SHA")"
          notes_file="$RUNNER_TEMP/formula-navigator-release-notes.md"
          printf 'Commit: [%s](%s/%s/commit/%s)\n\nCommit title: %s\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            "$commit_subject" > "$notes_file"

          for attempt in 1 2 3; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            if gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Formula Navigator $TAG" \
              --notes-file "$notes_file"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "Could not create release $TAG after $attempt attempts." >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

          for attempt in 1 2 3; do
            if gh release upload "$TAG" artifacts/FormulaNavigator64.xll --clobber; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              echo "Could not upload FormulaNavigator64.xll after $attempt attempts." >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
